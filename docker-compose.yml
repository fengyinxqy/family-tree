services:
  nextjs:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://family:family123@postgres:5432/familydb
      - AUTH_SECRET=${AUTH_SECRET:-supersecret-change-me}
      - FILE_STORAGE_ROOT=/app/data/materials
      - FILE_MAX_BYTES=${FILE_MAX_BYTES:-20971520}
      - MATERIAL_MAX_FILES=${MATERIAL_MAX_FILES:-50}
    volumes:
      - materialdata:/app/data/materials
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=family
      - POSTGRES_PASSWORD=family123
      - POSTGRES_DB=familydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d familydb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  materialdata:
